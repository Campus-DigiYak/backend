server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: digiyak-backend

  # Java 25 Virtual Threads: allows thousands of concurrent I/O & SSE streams without OS thread exhaustion
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/digiyak}
    username: ${POSTGRES_USER:digiyak}
    password: ${POSTGRES_PASSWORD:digiyak_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    # Disable Open-Session-in-View so DB connections are released right after the @Transactional service exits
    open-in-view: false
    # Hibernate validates JPA entities against Flyway-managed tables instead of auto-altering production schemas
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway executes versioned SQL migrations per module schema in deterministic order (V1..V7)
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public,identity,campus,delivery,dispatch,finance,modulith
    default-schema: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Persists Spring Modulith domain events into modulith.event_publication (Transactional Outbox pattern)
  modulith:
    events:
      jdbc:
        schema: modulith
        schema-initialization:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

digiyak:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-64-byte-random-secret-key-for-local-development-only}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  payment:
    provider: ${DIGIYAK_PAYMENT_PROVIDER:mock}
    paystack:
      base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
      secret-key: ${PAYSTACK_SECRET_KEY:sk_test_replace_me}
      webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:whsec_replace_me}
  economics:
    # 1500 bps = 15.00% Digiyak platform fee; remaining 85.00% goes to the student Runner
    default-platform-cut-bps: ${DIGIYAK_DEFAULT_PLATFORM_CUT_BPS:1500}
    # Runners owe Digiyak 15% on physical cash runs; cash runs pause once debt exceeds GHS 10.00 (1000 pesewas)
    default-runner-cash-credit-limit-pesewas: ${DIGIYAK_DEFAULT_RUNNER_CASH_CREDIT_LIMIT_PESEWAS:1000}
